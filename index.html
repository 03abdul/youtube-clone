<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A working YouTube clone: search, watch, like, subscribe and comment.">
    <meta name="theme-color" content="#ffffff">
    <title>YouTube Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header class="topbar">
        <div class="topbar__start">
            <button class="icon-btn" id="menuBtn" aria-label="Guide"><i class="fa-solid fa-bars"></i></button>
            <a href="#/" class="logo" aria-label="YouTube Home">
                <svg viewBox="0 0 28 20" width="28" height="20" aria-hidden="true"><rect width="28" height="20" rx="5.5" fill="#f00"/><path d="M11.2 5.6 18.6 10l-7.4 4.4z" fill="#fff"/></svg>
                <span>YouTube</span>
            </a>
        </div>

        <form class="search" id="searchForm" role="search">
            <button type="button" class="icon-btn search__back" id="searchBack" aria-label="Close search"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="search__box">
                <input type="search" id="searchInput" placeholder="Search" aria-label="Search" autocomplete="off">
                <button type="button" class="search__clear" id="searchClear" aria-label="Clear search" hidden><i class="fa-solid fa-xmark"></i></button>
            </div>
            <button class="search__btn" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button type="button" class="icon-btn icon-btn--filled search__mic" id="micBtn" aria-label="Search with your voice" hidden><i class="fa-solid fa-microphone"></i></button>
        </form>

        <div class="topbar__end">
            <button class="icon-btn search__open" id="searchOpen" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button class="icon-btn hide-sm" aria-label="Create"><i class="fa-solid fa-video"></i></button>
            <button class="icon-btn hide-sm" aria-label="Notifications"><i class="fa-regular fa-bell"></i></button>
            <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
            <span class="avatar avatar--me hide-sm" title="You">Y</span>
        </div>
    </header>

    <!-- Expanded guide (drawer on small screens / watch page) -->
    <nav class="sidebar" id="sidebar" aria-label="Guide">
        <ul>
            <li><a class="side-item" href="#/" data-nav="home"><i class="fa-solid fa-house"></i><span>Home</span></a></li>
            <li><a class="side-item" href="#/subscriptions" data-nav="subscriptions"><i class="fa-solid fa-tv"></i><span>Subscriptions</span></a></li>
        </ul>
        <hr>
        <h4>You</h4>
        <ul>
            <li><a class="side-item" href="#/history" data-nav="history"><i class="fa-solid fa-clock-rotate-left"></i><span>History</span></a></li>
            <li><a class="side-item" href="#/liked" data-nav="liked"><i class="fa-regular fa-thumbs-up"></i><span>Liked videos</span></a></li>
        </ul>
        <div id="sideSubs"></div>
        <hr>
        <h4>Explore</h4>
        <ul>
            <li><a class="side-item" href="#/"><i class="fa-solid fa-fire"></i><span>Trending</span></a></li>
            <li><a class="side-item" href="#/?cat=Music"><i class="fa-solid fa-music"></i><span>Music</span></a></li>
            <li><a class="side-item" href="#/?cat=Tamil%20cinema"><i class="fa-solid fa-clapperboard"></i><span>Movies</span></a></li>
            <li><a class="side-item" href="#/?cat=Live"><i class="fa-solid fa-tower-broadcast"></i><span>Live</span></a></li>
            <li><a class="side-item" href="#/?cat=Gaming"><i class="fa-solid fa-gamepad"></i><span>Gaming</span></a></li>
            <li><a class="side-item" href="#/?cat=Cricket"><i class="fa-solid fa-trophy"></i><span>Sports</span></a></li>
        </ul>
        <hr>
        <p class="side-foot">A clone built for learning.<br>Not affiliated with YouTube.</p>
    </nav>

    <!-- Mini guide (icons only) -->
    <nav class="mini" aria-label="Mini guide">
        <a class="mini__item" href="#/" data-nav="home"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a class="mini__item" href="#/subscriptions" data-nav="subscriptions"><i class="fa-solid fa-tv"></i><span>Subscriptions</span></a>
        <a class="mini__item" href="#/history" data-nav="history"><i class="fa-solid fa-clock-rotate-left"></i><span>History</span></a>
        <a class="mini__item" href="#/liked" data-nav="liked"><i class="fa-regular fa-thumbs-up"></i><span>Liked</span></a>
    </nav>

    <div class="scrim" id="scrim"></div>

    <main class="content" id="app" aria-live="polite"></main>

    <!-- Mobile bottom navigation -->
    <nav class="bottomnav" aria-label="Primary">
        <a href="#/" data-nav="home"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="#/subscriptions" data-nav="subscriptions"><i class="fa-solid fa-tv"></i><span>Subscriptions</span></a>
        <a href="#/liked" data-nav="liked"><i class="fa-regular fa-thumbs-up"></i><span>Liked</span></a>
        <a href="#/history" data-nav="history"><i class="fa-solid fa-clock-rotate-left"></i><span>History</span></a>
    </nav>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
